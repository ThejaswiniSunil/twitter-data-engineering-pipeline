<svg viewBox="0 0 920 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="920" height="470" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- title -->
  <text x="460" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Twitter Data Engineering Pipeline</text>

  <!-- Airflow orchestration band -->
  <rect x="30" y="48" width="860" height="78" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <!-- clock icon -->
  <circle cx="75" cy="87" r="20" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
  <path d="M75 74 V87 L84 93" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="80" font-size="16" font-weight="700" fill="#4c1d95">Apache Airflow · DAG: twitter_dag</text>
  <text x="112" y="102" font-size="13" fill="#5b21b6">Runs every 24 hours · PythonOperator → run_twitter_etl() · 1 retry · 1-minute retry delay</text>

  <!-- orchestration connectors -->
  <path d="M460 126 V150" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M115 150 H805" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <path d="M115 150 V192" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowDash)"/>
  <path d="M345 150 V192" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowDash)"/>
  <path d="M575 150 V192" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowDash)"/>
  <path d="M805 150 V192" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowDash)"/>
  <text x="470" y="144" font-size="11" fill="#7c3aed" font-style="italic">orchestrates &amp; schedules</text>

  <!-- Box 1: Source API -->
  <rect x="40" y="200" width="150" height="160" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <!-- cloud icon -->
  <path d="M78 258 a14 14 0 0 1 4 -27 a20 20 0 0 1 38 4 a12 12 0 0 1 -2 23 z" fill="#fff" stroke="#0284c7" stroke-width="3" stroke-linejoin="round"/>
  <text x="115" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Twitter / X API</text>
  <text x="115" y="316" text-anchor="middle" font-size="12" fill="#075985">User timeline</text>
  <text x="115" y="333" text-anchor="middle" font-size="12" fill="#075985">(up to 200 tweets)</text>

  <!-- Box 2: Extraction -->
  <rect x="270" y="200" width="150" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <!-- download arrow icon -->
  <path d="M345 224 V256" stroke="#16a34a" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M330 244 L345 259 L360 244" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M327 270 H363" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <text x="345" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Extraction</text>
  <text x="345" y="316" text-anchor="middle" font-size="12" fill="#166534">Tweepy</text>
  <text x="345" y="333" text-anchor="middle" font-size="12" fill="#166534">user_timeline()</text>

  <!-- Box 3: Processing -->
  <rect x="500" y="200" width="150" height="160" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <!-- table icon -->
  <rect x="550" y="226" width="50" height="44" rx="4" fill="#fff" stroke="#ca8a04" stroke-width="3"/>
  <path d="M550 241 H600 M550 256 H600 M567 226 V270 M584 226 V270" stroke="#ca8a04" stroke-width="2" fill="none"/>
  <text x="575" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">Processing</text>
  <text x="575" y="316" text-anchor="middle" font-size="12" fill="#854d0e">Pandas DataFrame</text>
  <text x="575" y="333" text-anchor="middle" font-size="12" fill="#854d0e">user · text · likes · RTs · date</text>

  <!-- Box 4: Storage -->
  <rect x="730" y="200" width="150" height="160" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <!-- file icon -->
  <path d="M783 226 H815 L828 239 V272 H783 Z" fill="#fff" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <path d="M815 226 V239 H828" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <path d="M791 250 H820 M791 259 H820" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="805" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">CSV Storage</text>
  <text x="805" y="316" text-anchor="middle" font-size="12" fill="#991b1b">refined_tweets.csv</text>
  <text x="805" y="333" text-anchor="middle" font-size="12" fill="#991b1b">Ready for analytics</text>

  <!-- data flow arrows -->
  <path d="M190 280 H266" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M420 280 H496" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M650 280 H726" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Future: S3 -->
  <path d="M805 360 V392" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrowDash)"/>
  <rect x="705" y="396" width="200" height="50" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="805" y="417" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">AWS S3 (future)</text>
  <text x="805" y="435" text-anchor="middle" font-size="11" fill="#5b21b6">cloud storage extension</text>

  <!-- legend -->
  <path d="M40 410 H80" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="90" y="414" font-size="12" fill="#334155">Data flow</text>
  <path d="M170 410 H210" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="220" y="414" font-size="12" fill="#334155">Orchestration / planned extension</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
